// The device <-> backend contract, schema v18, with the proposed v19 features fields and the
// proposed home boxes fields.
// Copied from the backend's canonical file; change it there first.

syntax = "proto3";

package rist.v1;

option java_package = "rist.v1";
option java_multiple_files = true;

enum SchemaVersion {
  option allow_alias = true;
  SCHEMA_VERSION_UNSET   = 0;
  SCHEMA_VERSION_1       = 1;
  SCHEMA_VERSION_2       = 2;
  SCHEMA_VERSION_3       = 3;
  SCHEMA_VERSION_4       = 4;
  SCHEMA_VERSION_5       = 5;
  SCHEMA_VERSION_6       = 6;
  SCHEMA_VERSION_7       = 7;
  SCHEMA_VERSION_8       = 8;
  SCHEMA_VERSION_9       = 9;
  SCHEMA_VERSION_10      = 10;
  SCHEMA_VERSION_11      = 11;
  SCHEMA_VERSION_12      = 12;

  SCHEMA_VERSION_13      = 13;
  SCHEMA_VERSION_14      = 14;

  SCHEMA_VERSION_15      = 15;
  SCHEMA_VERSION_16      = 16;

  SCHEMA_VERSION_17      = 17;

  SCHEMA_VERSION_18      = 18;
  SCHEMA_VERSION_CURRENT = 18;
}

message DeviceRequest {
  string device_id       = 1;
  string session_id      = 2;
  uint64 timestamp       = 3;
  oneof input {
    AudioInput audio     = 4;
    string     text      = 5;
    ImageInput image     = 10;
  }
  string  target_tool_id = 6;
  Confirmation confirm   = 7;
  string  auth_token     = 8;
  Capabilities caps      = 9;

  repeated InboundSms inbound_sms = 12;

  repeated CommsResult comms_results = 13;

  repeated string voicemail_ack = 14;

  repeated string voicemail_heard = 15;

  SettingsState settings_state = 16;
  Location location      = 11;

  string request_id = 17;

  repeated GeofenceEvent geofence_events = 18;

  repeated string geofence_state = 19;

  repeated string notification_ack = 20;

  repeated ImageInput images = 21;

  string utterance_id = 22;

  // Proposed (home boxes): the box a command-box tap or a box's edit sheet came from.
  string box_id = 23;
  // Proposed (home boxes): the BoxSet.version this phone holds.
  uint64 boxes_version = 24;

  // Proposed (design and settings): the DesignSpec.version this phone holds, 0 for none.
  uint64 design_version = 25;
  // Proposed (design and settings): what the phone did with the last DesignSpec, on the next turn.
  DesignState design_state = 26;
  // Proposed (design and settings): the SettingsCommand.version this phone last applied, 0 for none.
  uint64 settings_version = 27;
}

message Location { double lat = 1; double lon = 2; string label = 3; uint32 accuracy_m = 4;
                   uint64 timestamp = 5; uint32 age_s = 6; string timezone = 7;
                   float bearing_deg = 8; float bearing_accuracy_deg = 9; float speed_mps = 10; }

message AudioInput { uint32 sample_rate = 1; uint32 bit_depth = 2;
                     uint32 channels = 3; uint32 duration_ms = 4; bytes samples = 5;
                     string codec = 6; }

message ImageInput { string format = 1; uint32 width = 2; uint32 height = 3; bytes data = 4; }

message Confirmation { string action_id = 1; bool approved = 2; }

message Capabilities {

  uint32 schema_version      = 1;
  uint32 screen_w            = 2;
  uint32 screen_h            = 3;
  uint32 color_depth         = 4;
  repeated string input      = 5;
  // Proposed (design and settings): a phone that takes a DesignSpec lists "design_v1", and one
  // "font:<id>" for each font a design may name.
  repeated string components = 6;
  uint32 max_image_bytes     = 7;

  uint32 max_geofences       = 8;

  uint32 max_notifications   = 9;

}

message Progress {
  string text     = 1;
  string kind     = 2;
  string tool_id  = 3;
  bool   speakable = 4;
}

message DeviceResponse {
  uint32 status          = 1;
  Speech speech          = 2;
  ViewSpec view          = 3;
  repeated Action actions= 4;
  bool   is_final        = 5;
  ConfirmRequest confirm = 6;
  string tool_id         = 7;
  string request_id      = 8;

  Progress progress = 24;
  LocationRequest location_request = 9;
  MediaCommand media = 10;
  NavCommand nav = 11;
  AlarmCommand alarm = 12;
  TimerCommand timer = 13;
  StopwatchCommand stopwatch = 14;
  repeated Attachment attachments = 15;
  CommsCommand comms = 16;

  bool expects_reply = 17;

  BridgeCorrelation bridge = 18;

  repeated string sms_ack = 19;

  repeated string comms_results_ack = 20;

  repeated Voicemail voicemails = 21;

  uint32 voicemail_count = 22;

  SettingsCommand settings = 23;

  GeofenceArm geofences = 25;

  repeated string geofence_ack = 26;

  reserved 27;

  repeated Notification notifications = 28;

  uint32 mail_unread = 29;

  string contacts_cursor = 30;

  VideoCallCommand video_call = 31;

  // Proposed v19, not yet in the canonical contract: this account's features.
  FeatureSet features = 32;

  // Proposed (home boxes): this account's boxes.
  BoxSet boxes = 33;

  // Proposed (design and settings): this account's whole look.
  DesignSpec design = 34;
}

message Notification {

  string id      = 1;

  string kind    = 2;

  string title   = 3;

  string urgency = 4;

  uint64 created_at_epoch_s = 5;

}

message WakeSignal {
  uint32 status = 1;

  repeated Notification notifications = 2;

  uint32 mail_unread       = 3;
  uint32 voicemail_unheard = 4;

  uint32 pending = 5;

  uint64 server_time_ms = 6;

  uint32 poll_after_s = 7;

  string contacts_cursor = 8;

  repeated PendingAction actions = 9;

  // Proposed v19: the same list as DeviceResponse.features.
  FeatureSet features = 10;

  // Proposed (home boxes): the same list as DeviceResponse.boxes.
  BoxSet boxes = 11;

  // Proposed (design and settings): the same spec as DeviceResponse.design.
  DesignSpec design = 12;
  // Proposed (design and settings): a settings resend, as DeviceResponse.settings.
  SettingsCommand settings = 13;
}

message PendingAction {

  string action_id = 1;

  string kind = 2;

  string mode = 3;

  string recipient_name   = 4;
  string recipient_number = 5;

  string body = 6;

  string prompt = 7;

  uint64 expires_at_epoch_s = 8;
  uint64 created_at_epoch_s = 9;

  string instruction_id   = 10;
  string instruction_text = 11;
  uint64 due_at_epoch_s   = 12;

}

message PendingActionAck {
  string action_id = 1;

  string outcome = 2;

  string reason = 3;

  uint64 acted_at_ms = 4;

}

message PendingActionAckReply {
  uint32 status    = 1;
  string action_id = 2;
  string state     = 3;

}

message ContactSync {
  string cursor                    = 1;
  bool   full                      = 2;
  repeated ContactRecord contacts  = 3;
  repeated string deleted_ids      = 4;
  bool   more                      = 5;
}

message ContactRecord {
  string id                        = 1;
  string display_name              = 2;
  repeated string aliases          = 3;
  string description               = 4;
  uint64 updated_at_ms             = 5;
  repeated ContactMethod methods   = 6;
  string external_key              = 7;
}

message ContactMethod {
  string id                        = 1;
  string kind                      = 2;
  string label                     = 3;
  string value                     = 4;
  bool   is_primary                = 5;
}

message ContactPush {
  string since                        = 1;
  repeated ContactRecord changes      = 2;
  repeated string deleted_ids         = 3;
  repeated string deleted_method_ids  = 4;
}

message InboundSms {

  string id         = 1;
  string from       = 2;
  string body       = 3;

  int64  sent_at_ms = 4;
}

message BridgeCorrelation {

  string correlation_id = 1;
  string expect_from    = 2;
  uint32 valid_for_ms   = 3;
}

message CommsCommand {

  string action       = 1;
  string number       = 2;
  string display_name = 3;

  string body         = 4;

  string correlation_id = 5;
}

message CommsResult {
  string correlation_id = 1;
  string action         = 2;

  bool   performed      = 3;
  string error          = 4;
}

message Voicemail {
  string id             = 1;
  string from_number    = 2;
  string display_name   = 3;
  int64  received_at_ms = 4;
  uint32 duration_s     = 5;
  string transcript     = 6;

  string audio_url      = 7;
  bool   screened       = 8;

  bool   heard          = 9;

  bool   carrier_held   = 10;

}

message Attachment {
  string kind    = 1;
  string mime    = 2;
  string title   = 3;
  string text    = 4;
  bytes  data    = 5;
  string uri     = 6;
  string tool_id = 7;
}

message MediaCommand {
  string action           = 1;
  string stream_url       = 2;
  uint32 start_position_s = 3;
  string item_id          = 4;
  uint32 section          = 5;
  string title            = 6;
  string author           = 7;
  repeated string playlist= 8;
  int32  seek_to_s        = 9;
  int32  seek_by_s        = 10;
  float  rate             = 11;
}

message NavCommand {
  string action     = 1;
  double dest_lat   = 2;
  double dest_lon   = 3;
  string label      = 4;
  uint32 distance_m = 5;
  uint32 duration_s = 6;
  string mode       = 7;

  Corridor corridor = 8;
  repeated Maneuver turns = 9;
  string route_id   = 10;

  repeated NavFrame frames = 11;

  string shape = 12;

  repeated MapTile tiles = 13;
}

message MapTile {
  uint32 z     = 1;
  uint32 x     = 2;
  uint32 y     = 3;
  bytes  image = 4;

}

enum FrameRole {
  FRAME_OVERVIEW = 0;
  FRAME_FOLLOW   = 1;
  FRAME_MANEUVER = 2;
}

message NavFrame {
  FrameRole role          = 1;
  Corridor  strip         = 2;
  sint32    segment_index = 3;
  sint32    turn_index    = 4;
}

message Corridor {
  repeated Tile tiles = 1;
  uint32 tile_px      = 2;

  uint32 tile_px_h    = 13;
  uint32 zoom         = 3;

  double min_lat      = 4;
  double min_lon      = 5;
  double max_lat      = 6;
  double max_lon      = 7;
  uint32 palette      = 8;

  double center_lat   = 9;
  double center_lon   = 10;
  double bearing_deg  = 11;
  double m_per_px     = 12;
}

message Tile {
  sint32 x     = 1;
  sint32 y     = 2;
  bytes  image = 3;
}

message Maneuver {
  string instruction = 1;
  string street      = 2;
  uint32 type        = 3;

  uint32 distance_m  = 4;
  double lat         = 5;
  double lon         = 6;

  string short_instruction = 7;

  string exit_number = 8;
  string exit_branch = 9;
  string exit_toward = 10;
}

message AlarmCommand {
  string action           = 1;
  string alarm_id         = 2;
  string kind             = 3;
  uint64 fire_at_epoch_s  = 4;
  string label            = 5;
  string recurrence       = 6;
  bool   sound            = 7;
  bool   vibrate          = 8;
}

message TimerCommand {
  string action     = 1;
  uint32 duration_s = 2;
  string label      = 3;
  uint32 extend_s   = 4;
}

message StopwatchCommand {
  string action = 1;
}

message VideoCallCommand {
  string action   = 1;

  string url      = 2;
  string provider = 3;
  string title    = 4;

  string original_url = 5;
}

message AlarmEvent {
  string alarm_id  = 1;
  string event     = 2;
  uint64 timestamp = 3;
}

message MediaProgress {
  string user_id    = 1;
  string session_id = 2;
  string item_id    = 3;
  uint32 position_s = 4;
  uint32 section    = 5;
  string action     = 6;
  uint64 timestamp  = 7;

  string title      = 8;
}

message LocationRequest { uint32 max_age_s = 1; float min_accuracy_m = 2; string reason = 3; }

message Geofence {

  string id                 = 1;
  double lat                = 2;
  double lon                = 3;

  uint32 radius_m           = 4;
  string direction          = 5;

  uint32 dwell_s            = 6;

  uint32 poll_s             = 7;

  uint64 expires_epoch_s    = 8;

  bool   require_exit_first = 9;

  string label              = 10;
}

message GeofenceArm {
  repeated Geofence fences = 1;
}

message GeofenceEvent {

  string   id        = 1;
  string   fence_id  = 2;
  string   direction = 3;

  uint64   at_ms     = 4;

  Location fix       = 5;
}

message Speech { string text = 1; string ssml = 2; bytes audio = 3; string audio_codec = 4; }

message ViewSpec { Component root = 1; uint32 schema_version = 2; }
message Component {
  string type            = 1;
  map<string,string> props = 2;
  map<string,string> style = 3;
  repeated Component children = 4;
  string fallback_text   = 5;
  Action action          = 6;
}
message Action {
  string kind            = 1;
  string request_text    = 2;
  string tool_id         = 3;
  map<string,string> args= 4;
  string action_id       = 5;
}
message ConfirmRequest { string action_id = 1; string prompt = 2; }

message SettingsCommand {

  string command_id = 1;

  repeated SettingsWrite writes = 2;

  repeated string read = 3;

  // Proposed (design and settings): the account's settings version, only ever higher.
  uint64 version = 4;
  // Proposed (design and settings): writes holds every key the phone applies, as after a wipe.
  bool full = 5;
}

message SettingsWrite {

  string key = 1;

  oneof change {

    string value = 2;

    sint32 delta = 3;
  }
}

message SettingsState {

  string command_id = 1;
  repeated SettingsValue values = 2;
}

message SettingsValue {
  string key = 1;

  string value = 2;

  Outcome outcome = 3;

  enum Outcome {

    REPORTED = 0;

    APPLIED = 1;

    REFUSED = 2;

    UNKNOWN_KEY = 3;

    INVALID_VALUE = 4;

    // Proposed (design and settings): applied, but changed for safety; value is what was used.
    ADJUSTED = 5;
  }

  string detail = 4;
}

// Proposed v19. The whole list for this account each time it is sent.
message FeatureSet {
  repeated FeatureState features = 1;
}

// feature: an id such as "email" or "calls"; state: "on", "off" or "unavailable".
message FeatureState {
  string feature = 1;
  string state   = 2;
}

// Proposed (home boxes): one box on the home screen. Display text only: no colours, no
// layout, no URLs.
message HomeBox {
  string id                  = 1;
  string title               = 2;
  string value               = 3;
  string detail              = 4;
  // Command boxes only: the words a tap sends, verbatim.
  string command             = 5;
  uint64 updated_at_epoch_s  = 6;
  uint64 stale_after_epoch_s = 7;
  // "ok", "pending", "error", "paused" or "off"; anything else is drawn as "error".
  string state               = 8;
  string note                = 9;
  // A Material Symbols name ("mail", "partly_cloudy_day"); an unknown name falls back to
  // icon_image, else no icon. Never a URL.
  string icon                = 10;
  string feature             = 11;
  // "display" or "command"; anything else is a display box, which never sends.
  string kind                = 12;
  // Display boxes: markdown for the expanded view.
  string body                = 13;
  // A custom icon when no named one fits: PNG, at most 16 KB and 96 x 96 px, drawn as an alpha
  // mask in the theme's colours. Anything larger or undecodable draws no icon.
  bytes  icon_image          = 14;
  // The user's own words that define the box ("the temperature here, every 30 minutes"); the
  // phone pre-fills the box's "Change this box" sheet with them.
  string source_words        = 15;
}

// Proposed (home boxes): the whole list, in display order, every time it is sent.
message BoxSet {
  uint64 version          = 1;
  repeated HomeBox boxes  = 2;
}

// Proposed (home boxes): the body of POST /v1/device/boxes, touch edits that need no judgement.
message BoxEdit {
  string edit_id              = 1;
  uint64 base_version         = 2;
  repeated string order       = 3;
  repeated string delete_ids  = 4;
  repeated string restore_ids = 5;
  string rename_id            = 6;
  string rename_title         = 7;
  // Display boxes to bring up to date now. Never queued offline; the backend answers by sending a
  // list in which each box's updated_at_epoch_s has moved on, even when its value is unchanged.
  repeated string refresh_ids = 8;
  // New one-tap (command) tiles, made without a turn. The reply's list holds each new box.
  repeated BoxAdd add         = 9;
}

// A one-tap tile to make: command is exactly what the user typed; an empty title lets the backend
// name it.
message BoxAdd {
  string command = 1;
  string title   = 2;
}

message BoxEditReply {
  uint32 status = 1;
  BoxSet boxes  = 2;
}

// Proposed (design and settings): the account's whole look, sent whole every time. Tokens only:
// names and values from a fixed catalogue, never markup, addresses, images or code.
message DesignSpec {
  // Assigned by the backend and only ever higher; 0 means "not yet numbered" (phone to backend).
  uint64 version            = 1;
  // A label: "ledger", "night" or "high_contrast". The phone draws from tokens alone, over its
  // factory look; an unknown label is reported.
  string base_theme         = 2;
  // The complete token set, every time, never a delta.
  map<string, string> tokens = 3;
  // The token catalogue version the backend wrote against (1).
  uint32 catalogue          = 4;
  // Optional, at most 24 characters, plain text; shown in Settings.
  string name               = 5;
}

// Proposed (design and settings): what the phone did with a DesignSpec. Rides the next turn.
message DesignState {
  // The DesignSpec.version this answers.
  uint64 version = 1;
  // One per token not applied exactly as sent; key is the token name. Applied tokens are omitted.
  // A spec refused whole is one REFUSED value on key "*".
  repeated SettingsValue values = 2;
  // The user chose "Reset to default" on the phone.
  bool reset_on_device = 3;
}
